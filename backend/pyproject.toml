[project]
name = "logoped-project"
version = "0.00"
description = "The AI logoped site"
authors = [
    {name = "Madiyar"}
]
license = "FDF"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.139.0,<0.140.0)",
    "whisper (>=1.1.10,<2.0.0)",
    "rapidfuzz (>=3.14.5,<4.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "pyjwt[crypto] (>=2.13.0,<3.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)"
]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
